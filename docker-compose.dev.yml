services:
  dexchan_dev:
    build: .
    container_name: dexchan_dev
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEXCHAN_TOKEN=${DEXCHAN_DEV_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
      - CLIENT_ID=${CLIENT_ID}
    networks:
      - default
      - db_network

networks:
  db_network:
    external: true
    name: ${DB_NETWORK_NAME}
